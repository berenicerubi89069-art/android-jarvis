<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0066cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="248" fill="#040812" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0099ff" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="14 10" filter="url(#glowEffect)"/>

  <!-- Tech Degree Ticks -->
  <g stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7">
    <line x1="256" y1="20" x2="256" y2="44"/>
    <line x1="256" y1="468" x2="256" y2="492"/>
    <line x1="20" y1="256" x2="44" y2="256"/>
    <line x1="468" y1="256" x2="492" y2="256"/>
    <line x1="89" y1="89" x2="105" y2="105"/>
    <line x1="423" y1="423" x2="407" y2="407"/>
    <line x1="423" y1="89" x2="407" y2="105"/>
    <line x1="89" y1="423" x2="105" y2="407"/>
  </g>

  <!-- Mid Segment Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0099ff" stroke-width="3" stroke-dasharray="40 12" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Arc Reactor Radial Energy -->
  <circle cx="256" cy="256" r="100" fill="url(#reactorGlow)"/>

  <!-- Central Core Hexagon / Ring -->
  <polygon points="256,180 322,218 322,294 256,332 190,294 190,218" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#glowEffect)"/>
  <circle cx="256" cy="256" r="42" fill="#040812" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff" filter="url(#glowEffect)"/>
</svg>
